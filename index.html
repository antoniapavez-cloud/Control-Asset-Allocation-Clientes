// Devuelve las secciones (ejecutivos) presentes en un objeto base, ordenadas
function secOf(b) {
  const ks = Object.keys(b || {}).filter(k => Array.isArray(b[k]));
  return ks.sort((a, x) => a.localeCompare(x));
}
// Convierte montos en % enteros que suman exactamente 100 (método del mayor resto).
// Solo reparte cuando los montos cubren el total; si no (hay posiciones sin clasificar), redondea normal.
function repartirA100(montos, total) {
  if (!total) return montos.map(() => null);
  const exact = montos.map(m => (m || 0) / total * 100);
  const plain = exact.map(x => Math.round(x));
  const sumExact = exact.reduce((a, b) => a + b, 0);
  if (Math.abs(sumExact - 100) > 0.5) return plain;
  const out = exact.map(x => Math.floor(x));
  let falta = Math.round(sumExact) - out.reduce((a, b) => a + b, 0);
  const orden = exact.map((x, i) => ({
    i,
    r: x - Math.floor(x)
  })).sort((a, b) => b.r - a.r);
  for (let k = 0; k < orden.length && falta > 0; k++, falta--) out[orden[k].i]++;
  return out;
}

// agregando el campo _ejecutivo a cada una para mostrarlo como columna en tablas unificadas.
function filasConEjecutivo(base, secs) {
  const lista = secs || secOf(base);
  const out = [];
  lista.forEach(s => {
    (base[s] || []).forEach(r => out.push({
      ...r,
      _ejecutivo: s
    }));
  });
  return out;
}

function mesesPeriodicidad(valor) {
  if (!valor) return null;
  const v = String(valor).trim();

  const mOtro = v.match(/^otro:\s*(\d+(?:[.,]\d+)?)/i);
  if (mOtro) {
    const semanas = parseFloat(mOtro[1].replace(",", "."));

function fmtFechaPlanilla(valor) {
  if (valor == null || valor === "") return null;
  const meses = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  let d = null;
  if (valor instanceof Date) {
    d = valor;
  } else if (typeof valor === "number") {
    // serial de Excel: días desde 1899-12-30
    d = new Date(Math.round((valor - 25569) * 86400 * 1000));
  } else {
    const s = String(valor).trim();
    const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); // ISO
    if (m) return `${parseInt(m[3], 10)} ${meses[parseInt(m[2], 10) - 1]} ${m[1]}`;
    const m2 = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/); // dd/mm/yyyy
    if (m2) {
      const y = m2[3].length === 2 ? "20" + m2[3] : m2[3];
      return `${parseInt(m2[1], 10)} ${meses[parseInt(m2[2], 10) - 1]} ${y}`;
    }
    const parsed = new Date(s);
    if (!isNaN(parsed.getTime())) d = parsed;
  }

// Construye mapa alias -> {usd, rv} (% x100) desde la planilla de límites
// Formatea un número con N decimales usando coma decimal (formato chileno)
function dec(v, n = 1) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return Number(v).toFixed(n).replace(".", ",");
}

// Normaliza una clave de alias: mayúsculas, sin espacios alrededor ni dobles espacios.
// Determina si un instrumento RFN cuenta como "Estructurado" para el % de estructurado.
// Regla: el nombre contiene "Estructurado" (o "Banchile - Deuda Chilena"), PERO se EXCLUYE
// si el Manager del nombre (texto antes del primer " - ") calza con la columna Manager (M):
// se considera calce cuando la col M empieza con el manager del nombre (ignorando caso/espacios).
function esEstructuradoRFN(nombre, manager) {
  const nom = String(nombre || "");
  const tieneEstr = /estructurado/i.test(nom) || /banchile\s*-\s*deuda\s*chilena/i.test(nom);
  if (!tieneEstr) return false;
  const mgrNombre = nom.includes(" - ") ? nom.split(" - ")[0].trim() : "";
  if (mgrNombre) {
    const colM = String(manager || "").trim().toUpperCase().replace(/\s+/g, " ");
    const mn = mgrNombre.toUpperCase().replace(/\s+/g, " ");
    if (mn && colM.startsWith(mn)) return false; // manager propio → NO se suma al estructurado
  }
  return true;
}
function normAlias(v) {
  return String(v ?? "").trim().toUpperCase().replace(/\s+/g, " ");
}

// Busca en una fila el valor de una columna por nombre, tolerante a espacios/caso.
function getField(row, name) {
  if (row[name] !== undefined) return row[name];
  const target = String(name).trim().toLowerCase().replace(/\s+/g, " ");
  for (const k in row) {
    if (String(k).trim().toLowerCase().replace(/\s+/g, " ") === target) return row[k];
  }
  return undefined;
}
function buildLimits(rawLim) {
  const map = {};
  rawLim.forEach(r => {
    const alias = normAlias(getField(r, LIM_ALIAS));
    if (!alias) return;
    const usd = Number(getField(r, LIM_NEUTRO));
    const rv = Number(getField(r, LIM_RV_NEUTRO));
    const clpAct = Number(getField(r, LIM_CLP_ACTUAL));
    const alt = Number(getField(r, LIM_ALT_NEUTRO));
    const rf = Number(getField(r, LIM_RF_NEUTRO));
    map[alias] = {
      usd: isNaN(usd) ? null : Math.round(usd * 100),
      rv: isNaN(rv) ? null : Math.round(rv * 100),
      clpAct: isNaN(clpAct) ? null : Math.round(clpAct * 100),
      alt: isNaN(alt) ? null : Math.round(alt * 100),
      rf: isNaN(rf) ? null : Math.round(rf * 100),
      // proporción (0..1) para Alloc RFI
      usdRaw: isNaN(usd) ? null : usd,
      // proporción USD Neutro (0..1)
      bands: {
        usd: {
          min: Math.round((Number(getField(r, LIM_BANDS.usd.min)) || 0) * 100),
          max: Math.round((Number(getField(r, LIM_BANDS.usd.max)) || 0) * 100)
        },
        rv: {
          min: Math.round((Number(getField(r, LIM_BANDS.rv.min)) || 0) * 100),
          max: Math.round((Number(getField(r, LIM_BANDS.rv.max)) || 0) * 100)
        },
        alt: {
          min: Math.round((Number(getField(r, LIM_BANDS.alt.min)) || 0) * 100),
          max: Math.round((Number(getField(r, LIM_BANDS.alt.max)) || 0) * 100)
        }
      }
    };
  });
  return map;
}

// Clasifica un valor actual contra su banda [min,max]: 'bien' | 'cerca' | 'fuera'
function bandStatus(actual, band, margenPP = 2) {
  if (!band) return null;
  const {
    min,
    max
  } = band;
  // Si el mínimo es 0% y el actual es 0%, el cliente está en objetivo (no obligado a tener esta clase) → verde
  if (min === 0 && actual === 0) return "bien";
  if (actual < min || actual > max) return "fuera";
  // margen "cerca" en puntos porcentuales (configurable)
  if (actual <= min + margenPP || actual >= max - margenPP) return "cerca";
  return "bien";
}

// Calcula las desviaciones accionables de un cliente (misma lógica que Acciones/Ficha)
function calcularPendientes(r, rfnMeta, rfnTol) {
  const aum = r["AUM US"] || 0;
  const fx = r["AUM US"] && r["AUM CLP"] ? r["AUM CLP"] / r["AUM US"] : 950;
  const pend = [];
  const loUF = rfnMeta - rfnTol,
    hiUF = rfnMeta + rfnTol;
  [["USD", r.stUSD, r.Dif], ["RV", r.stRV, r.rvDif], ["ALT", r.stALT, r.altDif]].forEach(([dim, st, dif]) => {
    if (st === "fuera" && dif !== null && dif !== undefined) {
      const m = Math.abs(dif / 100 * aum);
      pend.push({
        tipo: "Límites",
        detalle: `${dim} fuera de banda (desvío ${dif > 0 ? "+" : ""}${dif}%)`,
        accion: dif < 0 ? "Comprar" : "Vender",
        usd: m,
        clp: m * fx,
        color: "#E07F5C"
      });
    }
  });
  if (r.rfnTotal > 0) {
    if (r.rfnUFexact !== null && (r.rfnUFexact < loUF || r.rfnUFexact > hiUF)) {
      const borde = r.rfnUFexact < loUF ? loUF : hiUF;
      const movCLP = Math.abs((r.rfnUFexact - borde) / 100) * r.rfnTotal;
      pend.push({
        tipo: "RFN UF",
        detalle: `% UF en ${Math.round(r.rfnUFexact)}% (meta ${rfnMeta}±${rfnTol}%)`,
        accion: r.rfnUFexact < loUF ? "Pasar a UF" : "Pasar a Nominal",
        usd: movCLP / fx,
        clp: movCLP,
        color: "#5D7082"
      });
    }
    const cuentasExcesoEstr = (r.rfnEstrCuentas || []).filter(c => c.pct > 80);
    if (cuentasExcesoEstr.length > 0) {
      const excesoCLP = cuentasExcesoEstr.reduce((s, c) => s + (c.pct - 80) / 100 * c.rfnTotal, 0);
      const detalle = cuentasExcesoEstr.length === 1 ? `${cuentasExcesoEstr[0].cliente}: estructurado en ${Math.round(cuentasExcesoEstr[0].pct)}% (>80%)` : `${cuentasExcesoEstr.length} cuentas con estructurado >80%`;
      pend.push({
        tipo: "RFN Estructurado",
        detalle,
        accion: "Reducir",
        usd: excesoCLP / fx,
        clp: excesoCLP,
        color: "#A9B3BC"
      });
    }
  }
  (r.cashCuentas || []).forEach(c => {
    if (c.cash > 20000) {
      const ex = c.cash - 20000;
      pend.push({
        tipo: "Cash alto",
        detalle: `${c.cliente} · cta ${c.nroCuenta}`,
        accion: "Invertir caja",
        usd: ex,
        clp: ex * fx,
        color: "#C0492A"
      });
    }
  });
  return pend;
}

// Registra Aller en el documento; devuelve la familia efectiva
// Reemplazos para los caracteres que la subfuente Aller no incluye.
// Sin esto, jsPDF descarta todo el texto que va después del glifo faltante.
const PDF_REEMPLAZOS = {
  "\u00b1": "+/-",
  "\u00ab": "\"",
  "\u00bb": "\"",
  "_": "-",
  "^": "",
  "~": "-",
  "\u00a0": " ",
  "\u00d7": "x",
  "\u00f7": "/",
  "\u00e7": "c",
  "\u00c7": "C",
  "\u00e0": "a",
  "\u00e8": "e",
  "\u00ec": "i",
  "\u00f2": "o",
  "\u00f9": "u",
  "\u00b5": "u",
  "\u00a9": "(c)",
  "\u00ae": "(r)",
  "\u00a7": "S",
  "\u00b6": "P",
  "\u00a3": "GBP",
  "\u00a2": "c",
  "\u2192": ">",
  "\u2713": "OK"
};
// Deja sólo caracteres que la fuente sí dibuja; el resto se sustituye o se descarta.
const PDF_SEGUROS = /[\x20-\x7E\u00a1\u00bf\u00b0\u00b7\u00aa\u00ba\u00c1\u00c9\u00cd\u00d3\u00da\u00dc\u00d1\u00e1\u00e9\u00ed\u00f3\u00fa\u00fc\u00f1\u2013\u2014\u2018\u2019\u201c\u201d\u2022\u2026\u20ac]/;
function sanPDF(t) {
  return String(t == null ? "" : t).split("").map(c => {
    if (PDF_REEMPLAZOS[c] !== undefined) return PDF_REEMPLAZOS[c];
    return PDF_SEGUROS.test(c) ? c : "";
  }).join("");
}

function registrarAller(doc) {
  try {
    doc.addFileToVFS("Aller-Light.ttf", ALLER_LIGHT_TTF);
    doc.addFont("Aller-Light.ttf", "Aller", "normal");
    doc.addFileToVFS("Aller-Bold.ttf", ALLER_BOLD_TTF);
    doc.addFont("Aller-Bold.ttf", "Aller", "bold");
    doc.setFont("Aller", "normal");
    return "Aller";
  } catch (e) {
    return "helvetica"; // respaldo si el visor no acepta la fuente
  }
}

// Carga jsPDF bajo demanda desde CDN (sirve en el demo y en el HTML descargado)
function ensureJsPDF() {
  return new Promise((resolve, reject) => {
    if (window.jspdf && window.jspdf.jsPDF) return resolve(window.jspdf.jsPDF);
    let s = document.querySelector("script[data-jspdf]");
    if (!s) {
      s = document.createElement("script");
      s.setAttribute("data-jspdf", "1");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      document.head.appendChild(s);
    }
    s.addEventListener("load", () => window.jspdf && window.jspdf.jsPDF ? resolve(window.jspdf.jsPDF) : reject(new Error("jsPDF no disponible")));
    s.addEventListener("error", () => reject(new Error("No se pudo cargar jsPDF")));
    if (window.jspdf && window.jspdf.jsPDF) resolve(window.jspdf.jsPDF);
  });
}

// Genera el Manual de Actualización y lo abre en una pestaña aparte, igual que el
// Reporte de Pendientes (sin diálogo de impresión).
function generarPDFManual() {
  const win = window.open("", "_blank");
  if (!win) {
    alert("Habilita las ventanas emergentes para abrir el PDF.");
    return;
  }
  win.document.write('<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Generando PDF\u2026</title></head><body style="margin:0;padding:44px;font-family:system-ui,sans-serif;color:#5D7082;font-size:15px;">Generando PDF\u2026</body></html>');
  win.document.close();
  const hoy = new Date();
  const meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const fechaTxt = `${hoy.getDate()} de ${meses[hoy.getMonth()]} de ${hoy.getFullYear()}`;
  ensureJsPDF().then(JsPDF => {
    const doc = new JsPDF({
      unit: "pt",
      format: "letter",
      compress: true
    });
    const PW = doc.internal.pageSize.getWidth();
    const PH = doc.internal.pageSize.getHeight();
    const M = 48;
    const CW = PW - 2 * M;
    const GREEN = [123, 193, 67],
      BLUE = [93, 112, 130],
      TXT = [27, 33, 39],
      DIM = [100, 100, 100],
      LINE = [230, 233, 236];
    let y = M;
    const FAM = registrarAller(doc);
    const _text = doc.text.bind(doc);
    doc.text = (txt, x, yy, opts) => _text(Array.isArray(txt) ? txt.map(sanPDF) : sanPDF(txt), x, yy, opts);
    const _split = doc.splitTextToSize.bind(doc);
    doc.splitTextToSize = (txt, w, o) => _split(sanPDF(txt), w, o);
    const setF = (style, size, color) => {
      doc.setFont(FAM, FAM === "Aller" && style === "italic" ? "normal" : style);
      doc.setFontSize(size);
      doc.setTextColor(color[0], color[1], color[2]);
    };
    // Logo MFO vectorial arriba a la derecha
    const logo = (x, yTop) => {
      const s = 52 / 46;
      const px = a => x + a * s,
        py = b => yTop + b * s;
      doc.setFillColor(155, 157, 160);
      doc.triangle(px(20), py(2), px(38), py(30), px(2), py(30), "F");
      doc.setDrawColor(GREEN[0], GREEN[1], GREEN[2]);
      doc.setLineWidth(4.5 * s);
      try {
        doc.setLineCap("round");
      } catch (e) {}
      let prev = null;
      for (let i = 0; i <= 14; i++) {
        const th = Math.PI * (1 - i / 14);
        const cx = px(35 + 8 * Math.cos(th)),
          cy = py(30 - 8 * Math.sin(th));
        if (prev) doc.line(prev[0], prev[1], cx, cy);
        prev = [cx, cy];
      }
      try {
        doc.setLineCap("butt");
      } catch (e) {}
    };
    const marcaMFO = yTop => {
      setF("bold", 20, TXT);
      const w = doc.getTextWidth("MFO");
      const bx = PW - M - w - 9 - 52;
      logo(bx, yTop + 4);
      doc.text("MFO", bx + 52 + 9, yTop + 30);
    };
    // Encabezado de página
    const encabezado = (titulo, bajada) => {
      marcaMFO(y);
      setF("bold", 20, TXT);
      doc.text(titulo, M, y + 18);
      let my = y + 38;
      if (bajada) {
        setF("normal", 10.5, DIM);
        doc.text(bajada, M, my);
        my += 14;
      }
      return my;
    };
    // ── Página 1: manual ──
    let my = encabezado("Manual de Actualizaci\u00f3n", "Seguimiento de Clientes \u00b7 uso interno");
    const meta = (lab, val) => {
      setF("bold", 10, BLUE);
      doc.text(lab, M, my);
      const w = doc.getTextWidth(lab);
      setF("normal", 10, TXT);
      doc.text(val, M + w + 4, my);
      my += 14;
    };
    meta("Frecuencia de actualizaci\u00f3n:", MANUAL_FRECUENCIA);
    meta("Encargada:", MANUAL_ENCARGADA);
    y = Math.max(my, y + 52) + 4;
    doc.setDrawColor(GREEN[0], GREEN[1], GREEN[2]);
    doc.setLineWidth(2.5);
    doc.line(M, y, PW - M, y);
    y += 24;
    setF("bold", 12.5, BLUE);
    doc.text("Rutina semanal", M, y);
    y += 7;
    doc.setDrawColor(LINE[0], LINE[1], LINE[2]);
    doc.setLineWidth(0.8);
    doc.line(M, y, PW - M, y);
    y += 18;
    MANUAL_PASOS.forEach((p, i) => {
      const nx = M + 4;
      setF("bold", 13, GREEN);
      doc.text(String(i + 1), nx, y);
      const tx = M + 22;
      setF("bold", 11, TXT);
      doc.text(p.titulo, tx, y);
      y += 14;
      setF("normal", 10, DIM);
      const lineas = doc.splitTextToSize(p.detalle, CW - 22);
      doc.text(lineas, tx, y);
      y += lineas.length * 12.5 + 13;
    });
    // ── Página 2: anexo ──
    doc.addPage();
    y = M;
    my = encabezado("ANEXO", "Consideraciones del Seguimiento de Clientes");
    y = Math.max(my, y + 52) + 4;
    doc.setDrawColor(GREEN[0], GREEN[1], GREEN[2]);
    doc.setLineWidth(2.5);
    doc.line(M, y, PW - M, y);
    y += 24;
    MANUAL_ANEXO.forEach(sec => {
      if (y > PH - 130) {
        doc.addPage();
        y = M;
      }
      setF("bold", 11.5, BLUE);
      doc.text(sec.titulo, M, y);
      y += 6;
      doc.setDrawColor(LINE[0], LINE[1], LINE[2]);
      doc.setLineWidth(0.8);
      doc.line(M, y, PW - M, y);
      y += 15;
      sec.items.forEach(t => {
        setF("normal", 10, TXT);
        const lineas = doc.splitTextToSize(t, CW - 16);
        if (y + lineas.length * 12.5 > PH - 60) {
          doc.addPage();
          y = M;
        }
        setF("bold", 12, GREEN);
        doc.text("\u2022", M + 2, y);
        setF("normal", 10, TXT);
        doc.text(lineas, M + 16, y);
        y += lineas.length * 12.5 + 7;
      });
      y += 12;
    });
    // Pie en todas las hojas
    const total = doc.internal.getNumberOfPages();
    for (let i = 1; i <= total; i++) {
      doc.setPage(i);
      doc.setDrawColor(LINE[0], LINE[1], LINE[2]);
      doc.setLineWidth(0.8);
      doc.line(M, PH - 44, PW - M, PH - 44);
      setF("normal", 8.5, [155, 157, 160]);
      doc.text(`MFO \u00b7 Manual de Actualizaci\u00f3n \u00b7 ${fechaTxt}`, M, PH - 30);
      doc.text(`P\u00e1gina ${i} de ${total}`, PW - M, PH - 30, {
        align: "right"
      });
    }
    doc.setProperties({
      title: "Manual de Actualizaci\u00f3n \u00b7 MFO",
      subject: "MFO \u00b7 Seguimiento de Clientes",
      author: "MFO",
      creator: "MFO"
    });
    const url = URL.createObjectURL(doc.output("blob"));
    win.location.href = url;
    setTimeout(() => {
      try {
        URL.revokeObjectURL(url);
      } catch (e) {}
    }, 120000);
  }).catch(e => {
    try {
      win.document.body.textContent = "No se pudo generar el PDF: " + (e && e.message ? e.message : e);
    } catch (_) {}
  });
}

// Calcula la lista de desviaciones accionables (Límites/RFN/Cash) para una base filtrada
function calcAcciones(base, rfnMeta, rfnTol) {
  const lista = [];
  const loUF = rfnMeta - rfnTol,
    hiUF = rfnMeta + rfnTol;
  secOf(base).forEach(sec => {
    (base[sec] || []).forEach(r => {
      const aum = r["AUM US"] || 0;
      const fx = r["AUM US"] && r["AUM CLP"] ? r["AUM CLP"] / r["AUM US"] : 950;
      [["USD", r.stUSD, r.Dif], ["RV", r.stRV, r.rvDif], ["ALT", r.stALT, r.altDif]].forEach(([dim, st, dif]) => {
        if (st === "fuera" && dif !== null && dif !== undefined) {
          const montoUSD = Math.abs(dif / 100 * aum);
          lista.push({
            alias: r.Alias,
            sec,
            tipo: "Límites",
            clase: "semaforo",
            detalle: `${dim} fuera de banda (desvío ${dif > 0 ? "+" : ""}${dif}%)`,
            accion: dif < 0 ? "Comprar" : "Vender",
            monto: montoUSD,
            montoCLP: montoUSD * fx
          });
        }
      });
      if (r.rfnTotal > 0) {
        if (r.rfnUFexact !== null && (r.rfnUFexact < loUF || r.rfnUFexact > hiUF)) {
          const borde = r.rfnUFexact < loUF ? loUF : hiUF;
          const movCLP = Math.abs((r.rfnUFexact - borde) / 100) * r.rfnTotal;
          const haciaUF = r.rfnUFexact < loUF;
          lista.push({
            alias: r.Alias,
            sec,
            tipo: "RFN UF",
            clase: "rfn",
            detalle: `% UF en ${Math.round(r.rfnUFexact)}% (meta ${rfnMeta}±${rfnTol}%)`,
            accion: haciaUF ? "Pasar a UF" : "Pasar a Nominal",
            monto: movCLP / fx,
            montoCLP: movCLP
          });
        }
        {
          const cuentasExceso = (r.rfnEstrCuentas || []).filter(c => c.pct > 80);
          if (cuentasExceso.length > 0) {
            const excesoCLP = cuentasExceso.reduce((s, c) => s + (c.pct - 80) / 100 * c.rfnTotal, 0);
            const detalle = cuentasExceso.length === 1 ? `${cuentasExceso[0].cliente}: estructurado en ${Math.round(cuentasExceso[0].pct)}% (>80%)` : `${cuentasExceso.length} cuentas con estructurado >80%`;
            lista.push({
              alias: r.Alias,
              sec,
              tipo: "RFN Estructurado",
              clase: "rfn",
              detalle,
              accion: "Reducir",
              monto: excesoCLP / fx,
              montoCLP: excesoCLP
            });
          }
        }
        {
          if (normAlias(r.Alias) === "JALABBE") {
            const alm = (r.rfnEstrCuentas || []).find(c => normAlias(c.cliente) === normAlias("El Almendral SpA"));
            if (alm && alm.rfnTotal > 150000000) {
              lista.push({
                alias: r.Alias,
                sec,
                tipo: "RFN",
                clase: "rfn",
                detalle: "Avisar a CV: El Almendral con más de $150MM en RFN",
                accion: "Avisar a CV",
                monto: alm.rfnTotal / fx,
                montoCLP: alm.rfnTotal,
                verFicha: true
              });
            }
          }
        }
      }
      (r.cashCuentas || []).forEach(c => {
        if (c.cash > 20000) {
          const exceso = c.cash - 20000;
          lista.push({
            alias: r.Alias,
            sec,
            tipo: "Cash alto",
            clase: "cash",
            detalle: `${c.cliente} · cta ${c.nroCuenta} (saldo $${Math.round(c.cash).toLocaleString("es-CL")})`,
            accion: "Invertir caja",
            monto: exceso,
            montoCLP: exceso * fx
          });
        }
      });
    });
  });
  const ordenTipo = {
    semaforo: 0,
    rfn: 1,
    cash: 2
  };
  lista.sort((a, b) => ordenTipo[a.clase] - ordenTipo[b.clase] || b.monto - a.monto);
  return lista;
}

    req.onerror = () => rej(req.error);
  });
}

      tx.objectStore(MINUTAS_STORE).put(handle, MINUTAS_KEY);
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  } catch (e) {/* ignorar */}
}

  try {
    const db = await idbOpen();

      const tx = db.transaction(MINUTAS_STORE, "readonly");
      const r = tx.objectStore(MINUTAS_STORE).get(MINUTAS_KEY);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => rej(r.error);
    });
  } catch (e) {
    return null;
  }
}
